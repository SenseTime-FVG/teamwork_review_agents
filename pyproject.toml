[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "teamwork-review-agents"
version = "0.2.0"
description = "定时扫描 GitHub/GitLab 变更请求并编排 Codex CLI Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "mcp>=1.29,<2",
  "portalocker>=2.10,<4",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
teamwork-review-agents = "teamwork_review_agents.cli:main"
teamwork-agent-mcp = "teamwork_review_agents.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teamwork_review_agents"]

[tool.hatch.build.targets.wheel.force-include]
"src/teamwork_review_agents/web/dist" = "teamwork_review_agents/web/dist"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
