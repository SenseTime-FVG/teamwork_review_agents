# Teamwork Review Agents 完整配置参考
#
# 这个文件可以直接复制为 config.yaml。Provider、仓库、环境变量和 Skill 均为注释示例；
# 项目内置 Agent 会显示在管理 UI 中，内置规则全部关闭，不会自动触发 Agent。
# 示例只保存 Token 的环境变量名或占位说明，绝不包含真实 Token。
# 所有相对路径都以 config.yaml 所在目录为基准。

# 必填：SQLite 用于保存 MR/PR 快照、事件、运行记录、日志和资源锁。
database:
  path: ./data/teamwork-review-agents.db

# 可选：MR/PR 轮询参数。整段省略时使用下列默认值。
# scanner:
#   # 两次自动扫描之间的秒数；300 秒即 5 分钟，服务启动后会先立即扫描一次。
#   interval_seconds: 300
#   # 单个仓库每轮最多补充详情的 MR/PR 数量；后台会自动处理 API 分页。
#   max_items_per_repository: 100
#   # 高级参数：单次平台列表 API 的分页大小，允许 1～100；通常无需修改。
#   api_page_size: 50
#   # 只控制首次建立快照时是否额外产生 discovered；扫描周期内真实发生的
#   # opened、closed、reopened 等事件始终会输出，不受该开关影响。
#   emit_initial_events: false

# 可选：Codex Agent、sub-agent、重试和写资源锁参数。
# runtime:
#   # 同一进程最多并行运行多少个 Codex CLI Agent。
#   max_concurrent_agents: 4
#   # 等待 MR/PR 或工作目录写锁的最长秒数。
#   lock_timeout_seconds: 300
#   # 写锁租约有效秒数；运行期间会自动续租。
#   lock_ttl_seconds: 120
#   # sub-agent 最大递归层数；0 表示禁止 sub-agent 再委托。
#   max_sub_agent_depth: 2
#   # 一个根任务最多启动的 Agent 总数，包含全部 sub-agent。
#   max_agent_runs_per_root: 8
#   # 事件或 Agent 失败后的额外重试次数；0 表示不重试。
#   event_retry_count: 2
#   # 失败、超时、存在未提交文件或未推送提交的临时 worktree 保留天数。
#   # 到期后会在下次准备同一仓库时强制清理；默认 7 天。
#   worktree_retention_days: 7
#   # Codex CLI 命令名，也可以配置为绝对路径。
#   codex_binary: codex
#   # 可选：为后台 Agent 使用独立的 Codex 配置目录，避免和桌面版或其他 CLI
#   # 共用模型缓存及 MCP 配置。首次使用前需要在该目录对应的环境中完成登录。
#   # codex_home: ./data/codex-home
#   # 可选：要求实际 Codex CLI 版本完全匹配；不匹配时运行会立即失败并给出诊断。
#   # expected_codex_version: 0.146.0
#   # 默认不继承 ~/.codex/config.toml 中的用户 MCP，避免后台 Agent 调起浏览器、
#   # Computer Use 或桌面应用工具后长期等待。改为 true 表示继承全部用户 MCP。
#   inherit_user_mcp_servers: false
#   # 在保持隔离时，可按 ~/.codex/config.toml 中的 MCP 名称显式放行所需服务。
#   allowed_user_mcp_servers: []
#   # Codex 连续多久没有输出新的 JSONL 进度就终止；和 Agent 总超时分别计算。
#   agent_idle_timeout_seconds: 300
#   # Teamwork 发起 Codex CLI 时使用的默认参数；不会修改 ~/.codex/config.toml。
#   codex:
#     # 可选：默认模型 ID。省略时继续使用 Codex 用户、仓库或账号默认值。
#     model: gpt-5.6-sol
#     # 可选：默认推理强度。具体可用值取决于模型，常见值如下。
#     model_reasoning_effort: high
#     # inherit：继承 Codex 配置；standard：显式关闭；fast：显式开启快速模式。
#     fast_mode: inherit
#     # 可选：模型输出详细度，可选 low、medium、high。
#     model_verbosity: medium
#     # 可选：交互风格，可选 none、friendly、pragmatic。
#     personality: pragmatic
#     # 可选：联网搜索策略，可选 disabled、cached、live。
#     web_search: cached
#     # 可选：其他 Codex config.toml 点号键。值支持字符串、数字、布尔值和简单数组。
#     # 模型结构化字段、Sandbox、审批策略、MCP 和 Skill 不能在这里覆盖。
#     extra_config:
#       history.max_bytes: 1048576
#   # 等待 sub-agent MCP Server 启动的最长秒数。
#   mcp_startup_timeout_seconds: 15
#   # 单次 invoke_agent MCP 调用的最长秒数。
#   mcp_tool_timeout_seconds: 1800
#   # 单次运行最多保留的 Codex JSONL 事件数。
#   max_jsonl_events: 2000

# 管理 API 与 UI 的默认启动配置。
web:
  # 默认只允许本机访问。监听 0.0.0.0 或其他非本机地址时必须配置 Token。
  host: 127.0.0.1
  # 管理 UI 与 API 监听端口。
  port: 8080
  # 检测 config.yaml 手工变化的周期秒数。
  config_poll_seconds: 2
  # 运行日志在 SQLite 中保留的天数。
  log_retention_days: 30
  # 可选：填写“保存管理员 Token 的宿主机环境变量名”，不是 Token 本身。
  # admin_token_env: TEAMWORK_ADMIN_TOKEN

# 可选：全部仓库和 Agent 都会继承的环境变量。
# 合并优先级为：全局 → 仓库 → Agent → 系统运行变量，后者覆盖前者。
# environment:
#   global:
#     # 简写等价于 value: Example Team；默认进入 Prompt 和 Codex 进程。
#     ORGANIZATION_NAME: Example Team
#     # 完整写法：value 与 from_system 只能选择一个。
#     DOCS_LANGUAGE:
#       value: zh-CN
#       secret: false
#       expose_to_prompt: true
#       expose_to_process: true
#     # 从启动服务的宿主机环境读取真实值，YAML 中不保存 Secret。
#     INTERNAL_API_TOKEN:
#       from_system: TEAMWORK_INTERNAL_API_TOKEN
#       # Secret 会在日志、Prompt 快照和配置历史中显示为 ********。
#       secret: true
#       # Secret 默认不进入 Prompt；只有明确需要时才改为 true。
#       expose_to_prompt: false
#       # 是否把变量传给 Codex CLI 子进程。
#       expose_to_process: true
#     # Provider 的 token_env 可以引用这里的同名变量。推荐使用 from_system，避免 Token 明文落盘。
#     GITHUB_TOKEN:
#       from_system: GITHUB_TOKEN
#       # Provider 凭据会被系统强制设为 Secret，且永远不会进入 Prompt 或 Codex 进程。
#       secret: true
#       expose_to_prompt: false
#       expose_to_process: false

# 可选：GitHub / GitLab API 连接。后台用它扫描远端 MR / PR；它不是 Git clone 或 SSH 连接。
# 键名是 Provider ID，由仓库的 provider 字段引用。
# providers:
#   github-main:
#     # 只允许 github 或 gitlab。
#     kind: github
#     # GitHub Enterprise 可替换成企业 API 地址。
#     base_url: https://api.github.com
#     # Provider Token 变量名。系统优先读取 environment.global 中的同名变量，
#     # 未配置时再从启动服务的宿主机环境读取。
#     token_env: GITHUB_TOKEN
#     # 单次 Provider API 请求超时秒数。
#     request_timeout_seconds: 30
#
#   gitlab-main:
#     kind: gitlab
#     base_url: https://gitlab.example.com/api/v4
#     token_env: GITLAB_TOKEN
#     request_timeout_seconds: 30

# 可选：需要扫描的仓库列表。
# repositories:
#   - # UI 和规则使用的仓库唯一 ID。
#     id: example-github
#     # 引用 providers 中的键名，决定扫描时使用哪个平台 API 和 Token。
#     provider: github-main
#     # 支持 owner/repository、group/project、SSH 或 HTTPS Git 地址。
#     project: git@github.com:owner/repository.git
#     # 基础 Git 仓库目录；不存在时会自动克隆，已存在时只校验并 fetch。
#     # Codex 不直接在这里运行，每次 Agent 会在 data/worktrees/ 下创建独立 worktree。
#     workspace: ./workspaces/example-github
#     # false 时不扫描，也不会处理该仓库的待处理事件。
#     enabled: true
#     # 可选：只覆盖当前仓库的环境变量。
#     environment:
#       REPOSITORY_TIER: production

# 可选：可由 Agent 独立装载的 Codex Skill。键名是本系统内引用的 Skill ID。
# skills:
#   incremental-doc-update:
#     # Skill 文件夹根部必须包含 SKILL.md；其中 YAML frontmatter 必须配置
#     # name 与 description。scripts/、references/、assets/ 等子目录会完整装载。
#     # 路径相对于 config.yaml；UI 支持从电脑导入整个文件夹到 ./skills/。
#     # 仓库根目录的 skills/ 默认被 Git 忽略，本地 Skill 不会自动提交。
#     path: ./skills/incremental-doc-update
#
#   security-review:
#     # 也可以引用运行服务的机器上已经存在的绝对目录。
#     path: /opt/teamwork-skills/security-review

# 内置 Codex CLI Agent。键名是 Agent 唯一名称，由规则和 sub-agent 白名单引用。
# 这里的定义会显示在首次启动的 UI 中，但只有启用规则后才会被自动触发。
agents:
  general-reviewer:
    # prompt_file 和 prompt 必须且只能配置一个；相对路径以 config.yaml 为基准。
    # 这三个明确列出的文件是项目内置 Prompt，其他 prompts/ 文件仍被 Git 忽略。
    prompt_file: ./prompts/general-review.md
    # 可选：model、model_reasoning_effort、fast_mode、model_verbosity、personality
    # 和 web_search 可以覆盖 runtime.codex；省略时继承运行时或 Codex 默认设置。
    # read-only：本地只读；workspace-write：工作区可写；
    # danger-full-access：完全访问。
    sandbox: workspace-write
    # 命令联网与本地文件权限分开控制。审核 Agent 默认允许联网，便于 gh 使用
    # 自己的系统钥匙串登录态；空白名单表示不限制目标域名。
    network_access: true
    network_domains: []
    # 单次 Codex CLI 运行最长秒数。
    timeout_seconds: 1200
    # 可选：覆盖 runtime.agent_idle_timeout_seconds；连续无进展时提前结束。
    # idle_timeout_seconds: 300
    # 写操作声明用于申请串行锁，不等同于平台账号授权。
    # workspace：修改代码、提交或推送；change_request：评论、标签或合并 MR/PR。
    write_scopes:
      - workspace
      - change_request
    # 只授予 invoke_agent 调用权限；空数组表示不能委托其他 Agent。
    allowed_sub_agents: []
    # 可选：当前 Agent 独立装载的 Skill ID，不继承给 sub-agent。
    # skills: []
    # 可选：output_schema、skip_git_repo_check 和 extra_codex_args 仍可按需配置。
    environment: {}

  incremental-doc-update-runner:
    prompt_file: ./prompts/增量文档更新入口.md
    sandbox: workspace-write
    # 允许入口 Agent 按需通过自身 gh / glab 登录态读取平台信息。
    network_access: true
    network_domains: []
    timeout_seconds: 1200
    write_scopes:
      - workspace
      - change_request
    # 入口 Agent 只能委托这个内置文档更新 Agent。
    allowed_sub_agents:
      - incremental-doc-updater
    environment:
      # Prompt 通过该变量读取实际要调用的 sub-agent 名称。
      INCREMENTAL_DOC_UPDATE_AGENT_NAME:
        value: incremental-doc-updater
        secret: false
        expose_to_prompt: true
        expose_to_process: true

  incremental-doc-updater:
    prompt_file: ./prompts/增量文档更新.md
    sandbox: workspace-write
    # 允许文档更新 Agent 按需通过自身 gh / glab 登录态读取平台信息。
    network_access: true
    network_domains: []
    timeout_seconds: 1200
    write_scopes:
      - workspace
      - change_request
    allowed_sub_agents: []
    environment: {}

# 内置 MR/PR 触发规则模板。全部默认关闭，管理员检查后再从 UI 主动启用。
# 支持 discovered、opened、reopened、closed、merged、commits_changed、
# draft_changed、labels_changed、approvals_changed、pipeline_changed、
# merge_status_changed 和 updated，完整名称以 change_request. 开头。
rules:
  - name: general-review
    events:
      - change_request.opened
      - change_request.reopened
    agents:
      - general-reviewer
    # 留空表示不限制仓库，也不附加快照字段条件。
    conditions: {}
    # 同轮多个匹配事件对每个目标 Agent 合并为一次运行。
    deduplicate_per_scan: true
    # 内置规则绝不自动启用。
    enabled: false

  - name: 增量文档更新
    events:
      - change_request.merged
    agents:
      - incremental-doc-update-runner
    conditions: {}
    deduplicate_per_scan: true
    # sub-agent 复用入口 Agent 的 worktree、分支、暂存区和未提交文件。
    inherit_workspace: true
    # 内置规则绝不自动启用。
    enabled: false

# Prompt 可直接使用的系统运行变量：
# REPOSITORY_ID、REPOSITORY_PROJECT、REPOSITORY_WORKSPACE、MR_NUMBER、MR_TITLE、
# MR_STATE、MR_HEAD_SHA、MR_SOURCE_BRANCH、MR_TARGET_BRANCH、MR_URL、EVENT_TYPE、RUN_ID。
